

services:
  blog-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: blog-backend
    container_name: blog-backend
    ports:
      - "3000:8000"
    volumes:
      - .:/var/www
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: root
      DB_PASSWORD: root
    command: sh -c "composer install && php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: mysql:latest
    container_name: mysql-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports: 
      - "9002:80"
    
      

volumes:
  dbdata:
