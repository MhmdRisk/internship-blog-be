services:
  blog-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: blog-backend
    container_name: blog-backend
    ports:
      - "8001:8002"
    volumes:
      - ./:/var/www
      # - appdata:/var/www
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: blog
      DB_USERNAME: root
      DB_PASSWORD: 
    command: sh -c "composer install && php artisan serve --host=127.0.0.1 --port=8000"

  db:
    image: mysql:latest
    container_name: mysql-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: blog
      MYSQL_USER: root
      MYSQL_PASSWORD:
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports: 
      - "9002:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: 
    
    
volumes:
  dbdata:
  # appdata:
